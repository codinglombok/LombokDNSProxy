name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m ./src/core/... ./src/proxy/... ./tests/...

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./src/core/... ./src/proxy/... ./tests/...

  # ─── Security ────────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./src/core/... ./src/proxy/...

      - name: CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          languages: go

  # ─── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests (race detector)
        run: go test -race -count=1 -timeout 120s ./src/core/... ./src/proxy/... ./tests/...

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic \
            ./src/core/... ./src/proxy/... ./tests/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          flags: unittests

  # ─── Fuzz (scheduled) ────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fuzz filter engine
        run: go test -fuzz=FuzzFilterIsBlocked -fuzztime=5m ./tests/...
      - name: Fuzz list parser
        run: go test -fuzz=FuzzLoadList -fuzztime=5m ./tests/...

  # ─── Browser extension build ─────────────────────────────────────────────────
  ext-build:
    name: Browser extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/browser-ext/package-lock.json
      - run: npm ci
        working-directory: src/browser-ext
      - name: Type-check
        run: npm run type-check
        working-directory: src/browser-ext
      - name: LombokFuzzer — protocol fuzz suite
        run: npm run fuzz
        working-directory: src/browser-ext
      - name: Build (Chrome MV3)
        run: npm run build
        working-directory: src/browser-ext
      - name: Build (Firefox MV2)
        run: npm run build:firefox
        working-directory: src/browser-ext
      - name: Verify every manifest-referenced file exists in both builds
        run: python3 ../../scripts/verify_ext_build.py
        working-directory: src/browser-ext
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-dist
          path: |
            src/browser-ext/dist/
            src/browser-ext/dist-firefox/

  # ─── Cross-platform build ────────────────────────────────────────────────────
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always --dirty)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X github.com/codinglombok/lombok-dns-proxy/internal/build.Version=${VERSION} \
                   -X github.com/codinglombok/lombok-dns-proxy/internal/build.BuildTime=${BUILD_TIME} \
                   -s -w"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -ldflags "${LDFLAGS}" \
            -o dist/lombok-dns-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./src/cli/main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lombok-dns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ─── Release ─────────────────────────────────────────────────────────────────
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [lint, security, test, ext-build]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-extension-dist
          path: src/browser-ext/dist/

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t codinglombok/lombok-dns-proxy:${{ github.ref_name }} \
            -t codinglombok/lombok-dns-proxy:latest \
            --push .
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
