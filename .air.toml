# LombokDNSProxy — Air hot-reload configuration
# Install: go install github.com/air-verse/air@latest
# Usage:   air -c .air.toml
# Part of the Lombok Ecosystem · Apache 2.0 · @codinglombok

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/lombok-dns ./src/cli/main.go"
  bin = "./tmp/lombok-dns"
  args_bin = ["start", "--port", "5353", "--config", "configs/default.yaml"]
  include_ext = ["go", "yaml", "yml"]
  exclude_dir  = [
    "dist", "tmp", "vendor", "node_modules",
    "src/gui/frontend", "src/browser-ext"
  ]
  exclude_file = ["_test.go"]
  exclude_regex = ["_test\\.go$"]
  delay = 500  # ms before rebuild after file change
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true
  rerun = false
  rerun_delay = 500

[log]
  time = true
  main_only = false

[color]
  main     = "magenta"
  watcher  = "cyan"
  build    = "yellow"
  runner   = "green"

[screen]
  clear_on_rebuild = true
  keep_scroll      = false
